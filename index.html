<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KNOW YOUR ENERGY</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #eaf4ec; color: #254b35; font: 18px/1.6 Arial, sans-serif; }
    main { max-width: 760px; margin: auto; padding: 24px; background: #fff; border-radius: 18px; }
    h1, h2 { color: #21834c; text-align: center; }
    .device { display: flex; align-items: center; gap: 12px; margin: 10px 0; padding: 14px; border: 1px solid #cde6d3; border-radius: 12px; }
    .device input { width: 22px; height: 22px; accent-color: #25864e; }
    .field { margin: 18px 0; }
    label, .label { display: block; font-weight: bold; }
    input[type=number] { width: 100%; padding: 12px; border: 1px solid #abc8b1; border-radius: 9px; font-size: 18px; }
    button { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: #25864e; color: white; font-size: 19px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #results { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; background: #eff8f0; }
    #message { margin-top: 14px; text-align: center; font-weight: bold; overflow-wrap: anywhere; }
    .hint { color: #718477; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>⚡ KNOW YOUR ENERGY</h1>
  <p style="text-align:center">Small Actions, Big Energy Savings 🌱</p>
  <p><strong>1. เลือกอุปกรณ์ที่ต้องการประหยัดพลังงาน</strong></p>
  <div id="devices"></div>
  <div id="deviceFields"></div>
  <div class="field">
    <label for="days">จำนวนวันที่ทำพฤติกรรม</label>
    <input id="days" type="number" min="1" step="1" value="1">
  </div>
  <button id="calculate" type="button">⚡ Calculate My Energy Saving</button>
  <section id="results" aria-live="polite">
    <h2>🎉 Your Energy Impact!</h2>
    <p>⚡ Energy Saved: <strong id="energy">0</strong> kWh</p>
    <p>🌍 Carbon Reduction: <strong id="carbon">0</strong> kgCO2e</p>
    <p>💰 Electricity Cost Saving: <strong id="cost">0</strong> THB</p>
    <div id="message"></div>
  </section>
  <p class="hint">Results are estimates based on reference power ratings.</p>
</main>
<script>
  // Public Apps Script Web App endpoint provided by the site owner.
  const SHEETS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxJ1D4rFb9jkRf0_AqQwdPyjCoWC-5KXTBniwZj6YZ33YQuK1aDWb_3V_m_W4mDe5iK/exec';
  const equipment = [
    { id: 'monitor', name: '🖥️ Computer Monitor', watt: 28 },
    { id: 'computer', name: '💻 Desktop Computer', watt: 90 },
    { id: 'laptop', name: '💻 Laptop', watt: 30 },
    { id: 'light', name: '💡 LED Light Bulb', watt: 12 },
    { id: 'projector', name: '📽️ LCD Projector', watt: 230 },
    { id: 'ac', name: '❄️ Air Conditioner', watt: 600 }
  ];
  const deviceRoot = document.getElementById('devices');
  const fieldsRoot = document.getElementById('deviceFields');
  const message = document.getElementById('message');

  equipment.forEach(item => {
    const label = document.createElement('label');
    label.className = 'device';
    label.innerHTML = `<input type="checkbox" value="${item.id}"><span>${item.name} (${item.watt} W)</span>`;
    const checkbox = label.querySelector('input');
    checkbox.addEventListener('change', () => {
      let field = document.getElementById('fields-' + item.id);
      if (checkbox.checked && !field) {
        field = document.createElement('div');
        field.className = 'field';
        field.id = 'fields-' + item.id;
        field.innerHTML = `<strong>${item.name}</strong>
          <label for="quantity-${item.id}">จำนวนอุปกรณ์</label>
          <input id="quantity-${item.id}" type="number" min="1" step="1" value="1">
          <label for="hours-${item.id}">ลดการใช้งานกี่ชั่วโมงต่อวัน?</label>
          <input id="hours-${item.id}" type="number" min="0.5" step="0.5" value="1">`;
        fieldsRoot.appendChild(field);
      } else if (!checkbox.checked && field) {
        field.remove();
      }
      document.getElementById('results').style.display = 'none';
    });
    deviceRoot.appendChild(label);
  });

  document.getElementById('calculate').addEventListener('click', async () => {
    const button = document.getElementById('calculate');
    const selected = equipment.filter(item => deviceRoot.querySelector(`input[value="${item.id}"]`).checked);
    const days = Number(document.getElementById('days').value);
    if (!selected.length) { alert('Please select at least one device.'); return; }
    if (!Number.isInteger(days) || days <= 0) { alert('Enter a valid number of days.'); return; }

    let energySaved = 0;
    const devices = [];
    for (const item of selected) {
      const quantity = Number(document.getElementById('quantity-' + item.id).value);
      const hours = Number(document.getElementById('hours-' + item.id).value);
      if (!Number.isInteger(quantity) || quantity <= 0 || !Number.isFinite(hours) || hours <= 0) {
        alert(`Enter a valid quantity and hours for ${item.name}.`);
        return;
      }
      const energy = item.watt * quantity * hours * days / 1000;
      energySaved += energy;
      devices.push({ name: item.name, watt: item.watt, quantity, hours, energy });
    }

    const carbon = energySaved * 0.5562;
    const cost = energySaved * 4.3555;
    document.getElementById('energy').textContent = energySaved.toFixed(2);
    document.getElementById('carbon').textContent = carbon.toFixed(2);
    document.getElementById('cost').textContent = cost.toFixed(2);
    document.getElementById('results').style.display = 'block';
    button.disabled = true;
    button.textContent = '⏳ กำลังบันทึกข้อมูล...';
    message.textContent = 'กำลังส่งข้อมูลไปยัง Google Sheets...';

    try {
      // text/plain avoids a CORS preflight. Apps Script receives the JSON in e.postData.contents.
      // The response is opaque in no-cors mode, so the browser cannot inspect the server's JSON reply.
      await fetch(SHEETS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ devices, days, carbon, cost })
      });
      message.textContent = 'ส่งคำขอบันทึกแล้ว หากไม่พบแถวใหม่ในชีต ให้ตรวจสอบสิทธิ์และ deployment ของ Apps Script';
    } catch (error) {
      message.textContent = 'ส่งข้อมูลไม่สำเร็จ: ' + (error.message || error);
    } finally {
      button.disabled = false;
      button.textContent = '⚡ Calculate My Energy Saving';
    }
  });
</script>
</body>
</html>
